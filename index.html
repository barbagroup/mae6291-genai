document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tint, use sparingly */\n  --color-ink:         #181712;  /* headings + body; a WARM near-black, not #000 */\n  --color-paper:       #FFFFFF;  /* page + card background */\n  --color-hairline:    #EAEBE6;  /* card borders, rules, dividers */\n  --color-muted:       #787876;  /* meta text: dates, copyright, captions */\n  --color-muted-soft:  #B4B4B2;  /* faint dividers, disabled states */\n  --color-icon-hover:  #9C9C9A;  /* grey that icons transition to on hover */\n\n  /* --- Illustration accent (never UI, links, or text) --- */\n  --color-slate:       #546E7D;\n\n  /* --- Semantic aliases --- */\n  --text-default:    var(--color-ink);\n  --text-meta-color: var(--color-muted);\n  --text-link:       var(--color-red);\n  --text-link-hover: var(--color-red-deep);\n  --surface-page:    var(--color-paper);\n  --surface-card:    var(--color-paper);\n  --border-hairline: var(--color-hairline);\n  --border-strong:   var(--color-ink);\n  --accent:          var(--color-red);\n  --accent-hover:    var(--color-red-deep);\n  --on-accent:       var(--color-paper);\n\n  /* --- Families --- */\n  --font-serif: \"Merriweather\", Georgia, \"Times New Roman\", serif;\n  --font-sans:  \"Source Sans 3\", \"Source Sans Pro\", system-ui,\n                -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: var(--font-serif);\n  --font-heading: var(--font-serif);\n  --font-body:    var(--font-sans);\n  --font-ui:      var(--font-sans);\n\n  /* --- Type scale (18px body base) --- */\n  --text-meta: 0.875rem;  /* 14px — meta, eyebrow, nav */\n  --text-body: 1.125rem;  /* 18px — body */\n  --text-h3:   1.375rem;  /* 22px — card title */\n  --text-h2:   1.75rem;   /* 28px — section */\n  --text-h1:   2.5rem;    /* 40px — page title + wordmark */\n\n  /* --- Weights --- */\n  --weight-regular:  400;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* --- Line height + tracking --- */\n  --leading-body:    1.6;\n  --leading-heading: 1.2;\n  --tracking-caps:   0.08em;\n\n  /* --- Spacing scale (4px base) --- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* --- Surfaces (flat, square, no shadow) --- */\n  --card-border:  1px solid var(--color-hairline);\n  --card-radius:  0;\n  --card-padding: var(--space-6);\n  --grid-gutter:  var(--space-6);\n  --radius-none:  0;\n  --border-width: 1px;\n  --shadow-none:  none;\n\n  /* --- Layout --- */\n  --page-gutter:        var(--space-8);\n  --page-gutter-mobile: var(--space-4);\n  --measure:            72ch;\n  --content-max:        1180px;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Lorena A. Barba Group — Base element layer\n   Built on the tokens. Editorial defaults: serif headings, sans body,\n   red links, flat hairline surfaces, square corners, no shadows.\n   ========================================================================== */\n\n/* --- Reset (minimal) --- */\n*, *::before, *::after { box-sizing: border-box; }\nbody, h1, h2, h3, h4, p, figure, ul, ol, blockquote { margin: 0; }\n\n/* --- Document --- */\nbody {\n  color: var(--color-ink);\n  background: var(--color-paper);\n  font-family: var(--font-sans);\n  font-size: var(--text-body);\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* --- Headings (serif) --- */\nh1, h2, h3 {\n  font-family: var(--font-serif);\n  font-weight: 700;\n  line-height: var(--leading-heading);\n  color: var(--color-ink);\n}\nh1 { font-size: var(--text-h1); margin-bottom: var(--space-6); }\nh2 { font-size: var(--text-h2); margin-bottom: var(--space-4); margin-top: var(--space-8); }\nh3 { font-size: var(--text-h3); margin-bottom: var(--space-3); margin-top: var(--space-6); }\n\n/* --- Body copy --- */\np { margin-bottom: var(--space-4); max-width: var(--measure); }\nstrong, b { font-weight: 700; }\nem, i { font-style: italic; }\n\n/* --- Links --- */\na { color: var(--color-red); text-decoration: none; }\na:hover, a:focus, a:active { color: var(--color-red-deep); text-decoration: underline; }\n\n/* --- Rules / dividers --- */\nhr {\n  border: 0;\n  border-top: 1px solid var(--color-hairline);\n  margin: var(--space-8) 0;\n}\n\n/* --- Meta text (dates, captions, copyright) --- */\nsmall, .meta {\n  font-size: var(--text-meta);\n  color: var(--color-muted);\n}\n\n/* ==========================================================================\n   Brand utilities\n   ========================================================================== */\n\n/* Eyebrow / navigation labels: uppercase, bold, letter-spaced sans */\n.eyebrow, .nav-link {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--text-meta);\n}\n.nav-link { color: var(--color-ink); }\n.nav-link:hover, .nav-link:focus { color: var(--color-red); text-decoration: none; }\n\n/* Single-color icons that grey on hover (use on inline SVG with fill) */\n.icon { fill: var(--color-red); transition: fill .15s ease; }\n.icon:hover, a:hover .icon { fill: var(--color-icon-hover); }\n\n/* Card: white surface, hairline border, square corners, flat */\n.card {\n  background: var(--color-paper);\n  border: var(--card-border);\n  border-radius: var(--card-radius);\n  padding: var(--card-padding);\n}\n\n/* Wordmark: \"Lorena A.\" in red, \"Barba group\" in ink */\n.wordmark {\n  font-family: var(--font-serif);\n  font-size: var(--text-h1);\n  line-height: 1;\n  color: var(--color-ink);\n}\n.wordmark .name  { font-weight: 400; color: var(--color-red); }\n.wordmark .group { font-weight: 700; color: var(--color-ink); }\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   MAE-6291 course site — page-specific styles\n   Minimal layer on top of tokens.css + base.css. Serious register only:\n   flat surfaces, square corners, hairline borders, Barba Red as accent.\n   ========================================================================== */\n\n/* --- Page frame --------------------------------------------------------- */\nbody {\n  padding: 0 var(--page-gutter);\n}\n.page {\n  max-width: 940px;\n  margin: 0 auto;\n  padding: var(--space-16) 0 var(--space-12);\n}\n@media (max-width: 640px) {\n  body { padding: 0 var(--page-gutter-mobile); }\n  .page { padding: var(--space-12) 0 var(--space-8); }\n}\n\n/* --- Visible focus everywhere ------------------------------------------- */\na:focus-visible,\n.table-scroll:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--color-red);\n  outline-offset: 2px;\n  text-decoration: none;\n}\n\n/* --- Masthead ----------------------------------------------------------- */\n.masthead {\n  border-bottom: 1px solid var(--color-hairline);\n  padding-bottom: var(--space-8);\n  margin-bottom: var(--space-12);\n}\n.wordmark {\n  font-family: var(--font-serif);\n  font-size: 1.5rem;\n  line-height: 1;\n  display: inline-block;\n  margin-bottom: var(--space-8);\n}\n.wordmark .name  { font-weight: 400; color: var(--color-red); }\n.wordmark .group { font-weight: 700; color: var(--color-ink); }\n\n.course-meta {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-2) var(--space-4);\n  align-items: baseline;\n  font-family: var(--font-sans);\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--text-meta);\n  color: var(--color-muted);\n  margin-bottom: var(--space-4);\n}\n.course-meta > span { white-space: nowrap; }\n.course-meta .code { color: var(--color-red); }\n.course-meta .sep  { color: var(--color-muted-soft); }\n\nh1 {\n  font-size: clamp(2rem, 5vw, var(--text-h1));\n  margin-bottom: var(--space-4);\n  text-wrap: balance;\n}\n.tagline {\n  font-size: var(--text-h3);\n  font-weight: 400;\n  color: var(--color-ink);\n  max-width: 62ch;\n  margin-bottom: 0;\n}\n\n/* --- Sections ----------------------------------------------------------- */\nsection { margin-bottom: var(--space-12); }\nsection > h2:first-child { margin-top: 0; }\n.lede { max-width: var(--measure); }\n\n/* --- Details card ------------------------------------------------------- */\n.details {\n  background: var(--color-paper);\n  border: var(--card-border);\n  padding: var(--card-padding) var(--space-8);\n}\n.details dl {\n  margin: 0;\n  display: grid;\n  grid-template-columns: max-content 1fr;\n  column-gap: var(--space-8);\n  row-gap: var(--space-3);\n}\n.details dt {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--text-meta);\n  color: var(--color-muted);\n  padding-top: 2px;\n}\n.details dd {\n  margin: 0;\n  max-width: var(--measure);\n}\n@media (max-width: 560px) {\n  .details { padding: var(--card-padding); }\n  .details dl { grid-template-columns: 1fr; row-gap: var(--space-1); }\n  .details dd { margin-bottom: var(--space-3); }\n  .details dd:last-child { margin-bottom: 0; }\n}\n\n/* --- Schedule table ----------------------------------------------------- */\n.table-scroll {\n  overflow-x: auto;\n  border: 1px solid var(--color-hairline);\n}\n.schedule {\n  width: 100%;\n  min-width: 720px;\n  border-collapse: collapse;\n  font-family: var(--font-sans);\n  font-size: 1rem;\n}\n.schedule caption {\n  text-align: left;\n  caption-side: top;\n  font-family: var(--font-sans);\n  font-size: var(--text-meta);\n  color: var(--color-muted);\n  padding: 0 0 var(--space-3);\n}\n.schedule thead th {\n  text-align: left;\n  vertical-align: bottom;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--text-meta);\n  color: var(--color-ink);\n  background: var(--color-paper);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-ink);\n  white-space: nowrap;\n}\n.schedule tbody th,\n.schedule tbody td {\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-hairline);\n  vertical-align: top;\n}\n.schedule tbody tr:last-child th,\n.schedule tbody tr:last-child td { border-bottom: 0; }\n\n.schedule tbody th[scope=\"row\"] {\n  font-family: var(--font-serif);\n  font-weight: 700;\n  font-size: var(--text-h3);\n  color: var(--color-ink);\n  font-variant-numeric: tabular-nums;\n  width: 1%;\n  white-space: nowrap;\n  line-height: 1.1;\n}\n.col-date {\n  white-space: nowrap;\n  color: var(--color-muted);\n  font-variant-numeric: tabular-nums;\n  width: 1%;\n}\n.col-topic { min-width: 22rem; max-width: 34rem; text-wrap: pretty; }\n.col-link {\n  white-space: nowrap;\n  width: 1%;\n}\n\n/* Link affordance inside the table */\n.doc-link {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-1);\n  font-weight: 600;\n}\n.doc-link .arrow { font-size: 0.85em; line-height: 1; }\n\n/* Muted em dash for \"no link\" */\n.nolink {\n  color: var(--color-muted-soft);\n  user-select: none;\n}\n\n/* No-class rows: de-emphasized */\n.schedule tr.no-class th[scope=\"row\"],\n.schedule tr.no-class td { color: var(--color-muted); }\n.schedule tr.no-class .col-topic {\n  font-style: italic;\n}\n\n/* --- Footer ------------------------------------------------------------- */\n.site-footer {\n  border-top: 1px solid var(--color-hairline);\n  padding-top: var(--space-8);\n  margin-top: var(--space-16);\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-2) var(--space-6);\n  align-items: baseline;\n  font-size: var(--text-meta);\n  color: var(--color-muted);\n}\n.site-footer .dot { color: var(--color-muted-soft); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"page\">\n\n    <!-- ===================== Masthead ===================== -->\n    <header class=\"masthead\">\n      <span class=\"wordmark\"><span class=\"name\">Lorena A.<\u002Fspan> <span class=\"group\">Barba group<\u002Fspan><\u002Fspan>\n\n      <p class=\"course-meta\">\n        <span class=\"code\">MAE-6291<\u002Fspan>\n        <span class=\"sep\" aria-hidden=\"true\">·<\u002Fspan>\n        <span>Spring 2026<\u002Fspan>\n      <\u002Fp>\n\n      <h1>Generative AI for Engineering Research<\u002Fh1>\n\n      <p class=\"tagline\">Leverage AI as a research accelerator: practical tools to enhance PhD research productivity.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- ===================== About ===================== -->\n    <section aria-labelledby=\"about-heading\">\n      <h2 id=\"about-heading\">About<\u002Fh2>\n      <p class=\"lede\">This course teaches engineering PhD students to use generative AI to accelerate their research rather than to build AI systems. It covers literature-review assistance, agentic research workflows, and AI-enhanced coding, alongside enough foundations — neural networks, transformers, tokenization, embeddings, retrieval-augmented generation — to use these tools effectively and critically.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ===================== Details ===================== -->\n    <section aria-labelledby=\"details-heading\">\n      <h2 id=\"details-heading\">Course details<\u002Fh2>\n      <div class=\"details\">\n        <dl>\n          <dt>Instructor<\u002Fdt>\n          <dd>Prof. Lorena A. Barba<\u002Fdd>\n\n          <dt>Prerequisites<\u002Fdt>\n          <dd>PhD student status in engineering (or permission of the instructor) and proficiency in Python. No prior AI or machine-learning coursework required.<\u002Fdd>\n\n          <dt>Contact<\u002Fdt>\n          <dd><a href=\"mailto:labarba@gwu.edu\">labarba@gwu.edu<\u002Fa><\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== Schedule ===================== -->\n    <section aria-labelledby=\"schedule-heading\">\n      <h2 id=\"schedule-heading\">Schedule<\u002Fh2>\n      <div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-labelledby=\"schedule-heading\">\n        <table class=\"schedule\">\n          <caption>Weekly schedule — Spring 2026. Notes open in Google Docs; slides open in Google Slides.<\u002Fcaption>\n          <thead>\n            <tr>\n              <th scope=\"col\">Class<\u002Fth>\n              <th scope=\"col\">Date<\u002Fth>\n              <th scope=\"col\">Topic<\u002Fth>\n              <th scope=\"col\">Notes<\u002Fth>\n              <th scope=\"col\">Slides<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr>\n              <th scope=\"row\">1<\u002Fth>\n              <td class=\"col-date\">Jan 13<\u002Ftd>\n              <td class=\"col-topic\">Course introduction; AI-for-science overview; the illusion of knowledge<\u002Ftd>\n              <td class=\"col-link\"><a class=\"doc-link\" href=\"https://docs.google.com/document/d/15Ftc0HcFImxyKt00MdjFmvZ8k6F7SamNRGnRl24uxq0/edit\" target=\"_blank\" rel=\"noopener\" aria-label=\"Class 1 notes (opens in new tab)\">Notes<span class=\"arrow\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa><\u002Ftd>\n              <td class=\"col-link\"><a class=\"doc-link\" href=\"https://docs.google.com/presentation/d/1u-T-Ru3pfGQDESnvL51loh4xOFIVV3TLnFZZ2RqbHME/edit\" target=\"_blank\" rel=\"noopener\" aria-label=\"Class 1 slides (opens in new tab)\">Slides<span class=\"arrow\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa><\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <th scope=\"row\">2<\u002Fth>\n              <td class=\"col-date\">Jan 20<\u002Ftd>\n              <td class=\"col-topic\">Foundations of generative AI: neural networks, transformers, attention; reasoning, chain-of-thought; context, tool use, RAG<\u002Ftd>\n              <td class=\"col-link\"><a class=\"doc-link\" href=\"https://docs.google.com/document/d/1FltMoXuW8dyv-yplzucOCe-APZWTYH5dW_BvkNSRZ_M/edit\" target=\"_blank\" rel=\"noopener\" aria-label=\"Class 2 notes (opens in new tab)\">Notes<span class=\"arrow\"
